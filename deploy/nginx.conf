# HTTPS is live via Certbot (Let's Encrypt) for clinicms.duckdns.org. The
# `ssl_*`/`include`/`ssl_dhparam` lines below reference files Certbot
# generates on THIS server (/etc/letsencrypt/...) — if this config is ever
# applied to a fresh box, run `certbot --nginx -d clinicms.duckdns.org` there
# first (see Goal 4 in Django_VPS_Deployment_Master_Plan.md), then those
# paths will exist.

server {
    server_name 213.199.47.114 clinicms.duckdns.org;

    client_max_body_size 100M;   # default (1M) breaks scan/audio uploads

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/clinic_app/Backend/staticfiles/;
    }

    location /media/ {
        alias /var/www/clinic_app/Backend/media/;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/clinic_app/Frontend/dist;
        try_files $uri /index.html;   # SPA client-side routing (createBrowserRouter)
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/clinicms.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/clinicms.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = clinicms.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name 213.199.47.114 clinicms.duckdns.org;
    return 404; # managed by Certbot
}
