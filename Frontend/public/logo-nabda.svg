<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 28 224 70" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8cc" />
      <stop offset="100%" stop-color="#0055b3" />
    </linearGradient>
  </defs>

  <!-- Background for contrast (optional, transparent by default) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- EKG line and person icon combined element (forming the letter 'N' or a heartbeat graphic before 'abda') -->
  <g fill="none" stroke="url(#logoGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Person dot head -->
    <circle cx="45" cy="45" r="4" fill="url(#logoGradient)" stroke="none" />

    <!-- Pulse / EKG Path -->
    <path d="M 20 70 L 38 70 L 45 45 L 52 85 L 60 40 L 68 75 L 75 70 L 90 70" stroke-width="4" />
  </g>

  <!-- Typography: abda -->
  <text x="92" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" font-style="italic" fill="url(#logoGradient)" letter-spacing="-1">abda</text>
</svg>
